spring.application.name=forgeorder

# --- Database connection ---
spring.datasource.url=jdbc:postgresql://localhost:5433/forgeorder
spring.datasource.username=forgeorder_user
spring.datasource.password=forgeorder_pass
spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.hikari.data-source-properties.options=-c TimeZone=UTC

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- Flyway ---
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ---Rabbit MQ ---
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=forgeorder_user
spring.rabbitmq.password=forgeorder_pass

spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.initial-interval=1000
spring.rabbitmq.listener.simple.default-requeue-rejected=false

management.health.redis.enabled=false