services:
  postgres:
    image: postgres:16
    container_name: forgeorder-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: forgeorder
      POSTGRES_USER: forgeorder_user
      POSTGRES_PASSWORD: forgeorder_pass
    ports:
      - "5433:5432"
    volumes:
      - forgeorder-postgres-data:/var/lib/postgresql/data

volumes:
  forgeorder-postgres-data: